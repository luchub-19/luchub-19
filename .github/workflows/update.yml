name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"      # mỗi ngày 03:17 UTC
  workflow_dispatch:           # bấm tay trong tab Actions
  push:
    branches: [main]
    paths: ["tools/**", "data/radio.json"]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - name: Lấy số liệu và dựng lại SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/fetch_stats.py "${{ github.repository_owner }}"
          python tools/build_assets.py
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json assets
          git diff --staged --quiet && exit 0
          git commit -m "chore: update stats"
          git pull --rebase
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF3E8A&color_dots=#2A1160,#7B3FE4,#C93A92,#FF6F61,#FFD35A
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
